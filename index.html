<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#24443a">
  <meta name="description" content="京都・大阪 2026旅行の共有用トリップボード">
  <title>KYOTO / OSAKA TRIP 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Zen+Old+Mincho:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="venue-guide.css">
  <style>
    .top-tab-shell{position:sticky;top:0;z-index:60;margin-top:-16px;padding:0 0 12px;pointer-events:none}
    .top-tab-shell .shell{pointer-events:auto}
    .top-tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:6px;background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 34px rgba(31,46,41,.13);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .top-tab{appearance:none;border:0;background:transparent;color:var(--muted);border-radius:12px;padding:10px 7px;font:inherit;font-size:.76rem;font-weight:800;white-space:nowrap;cursor:pointer;transition:background .16s ease,color .16s ease,box-shadow .16s ease}
    .top-tab:hover{background:var(--soft);color:var(--deep)}
    .top-tab.active{background:var(--deep);color:#fff;box-shadow:0 5px 14px rgba(36,68,58,.18)}
    .top-tab-featured:not(.active){color:#765e28;background:linear-gradient(135deg,var(--goldsoft),rgba(255,255,255,.65))}
    .main-shell{margin-top:2px;padding-bottom:52px}
    .day-tabs{top:62px}
    .info-anchor{scroll-margin-top:74px}
    @media(max-width:820px){
      .top-tab-shell{margin-top:-11px;padding-bottom:9px}
      .top-tab-shell .shell{width:100%}
      .top-tabs{display:flex;overflow-x:auto;gap:4px;padding:5px 10px;border-left:0;border-right:0;border-radius:0;scrollbar-width:none;box-shadow:0 8px 24px rgba(31,46,41,.11)}
      .top-tabs::-webkit-scrollbar{display:none}
      .top-tab{flex:0 0 auto;min-width:78px;padding:9px 12px;font-size:.7rem}
      .top-tab-featured{min-width:96px}
      .main-shell{margin-top:0;padding-bottom:38px}
      .day-tabs{top:54px}
      .info-anchor{scroll-margin-top:64px}
    }
    @media print{.top-tab-shell{display:none!important}}
  </style>
</head>
<body>
  <header class="hero">
    <div class="shell hero-inner">
      <div class="hero-topline">
        <div class="eyebrow">SEPTEMBER 07—10 · 2026</div>
        <button id="shareButton" class="share-button" type="button">共有</button>
      </div>
      <h1>京都・大阪 <span>TRIP BOARD</span></h1>
      <p>旅程・候補・ホテル・食事・公式リンクを、旅行中にすぐ開ける共有ハブ。</p>
      <div id="tripStatus" class="trip-status"></div>
    </div>
  </header>

  <nav class="top-tab-shell" aria-label="メインメニュー">
    <div class="shell">
      <div class="top-tabs" id="topTabs">
        <button class="top-tab active" type="button" data-menu-view="plan">日程</button>
        <button class="top-tab" type="button" data-menu-view="spots">スポット</button>
        <button class="top-tab" type="button" data-menu-view="info" data-menu-target="staySection">ホテル</button>
        <button class="top-tab" type="button" data-menu-view="info" data-menu-target="foodSection">食事</button>
        <button class="top-tab top-tab-featured" type="button" data-menu-view="info" data-menu-target="linksSection">公式リンク</button>
        <button class="top-tab" type="button" data-menu-view="budget">予算</button>
      </div>
    </div>
  </nav>

  <main class="shell main-shell">
    <section id="view-plan" class="app-view active" data-view="plan">
      <nav id="dayTabs" class="day-tabs" aria-label="日程"></nav>
      <section id="todaySection" class="panel plan-panel">
        <div class="section-heading">
          <div><p class="kicker">DAY PLAN</p><h2 id="todayHeading">今日の予定</h2></div>
          <span class="updated">更新 2026.09.02</span>
        </div>
        <div id="todayContent"></div>
      </section>
    </section>

    <section id="view-spots" class="app-view" data-view="spots">
      <section id="spotsSection" class="panel">
        <div class="section-heading spot-heading">
          <div><p class="kicker">SPOT BOARD</p><h2>行く場所・候補</h2></div>
          <div id="spotFilters" class="filters"></div>
        </div>
        <div id="spotGrid" class="spot-grid"></div>
      </section>
    </section>

    <section id="view-info" class="app-view" data-view="info">
      <section class="info-grid">
        <article id="staySection" class="panel info-anchor"><div class="section-heading compact"><div><p class="kicker">STAYS</p><h2>ホテル</h2></div></div><div id="stayCards" class="stack"></div></article>
        <article id="foodSection" class="panel info-anchor"><div class="section-heading compact"><div><p class="kicker">FOOD</p><h2>食事の固定枠</h2></div></div><div id="foodCards" class="stack"></div></article>
        <article id="linksSection" class="panel info-links-panel info-anchor"><div class="section-heading compact"><div><p class="kicker">QUICK LINKS</p><h2>公式リンク集</h2></div></div><div id="officialLinks" class="official-links"></div></article>
      </section>
      <section class="notice"><strong>旅行直前チェック</strong><p>交通時刻・臨時休館・営業時間は変更される可能性あり。このサイトを計画のハブにして、最終確認だけ公式サイトで行う。</p></section>
    </section>

    <section id="view-budget" class="app-view" data-view="budget">
      <section id="budgetSection" class="panel budget-panel">
        <div class="section-heading compact"><div><p class="kicker">BUDGET</p><h2>予算</h2></div></div>
        <div id="budgetContent"></div>
      </section>
    </section>
  </main>

  <script src="trip-data.js"></script>
  <script src="app.js"></script>
  <script src="venue-guide.js"></script>
</body>
</html>
